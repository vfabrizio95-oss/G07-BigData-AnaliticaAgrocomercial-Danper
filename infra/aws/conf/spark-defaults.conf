# Danper G07 - Spark sobre YARN en el cluster AWS.
# MASTER_HOST se reemplaza al instalar cada nodo (infra/aws/instalar_nodo.sh).

# Las aplicaciones se envían a YARN; el driver corre en el master (modo client)
spark.master                     yarn
spark.submit.deployMode          client

# Un executor por worker, del tamaño de la máquina (2 vCPU, 8 GB; YARN da 6 GB).
# 4 GB + 10 % de overhead caben en los 6 GB de cada NodeManager.
# --executores 1 2 3 de prueba_escalabilidad.py cambia spark.executor.instances.
spark.executor.cores             2
spark.executor.memory            4g
spark.executor.instances         3
spark.dynamicAllocation.enabled  false

# El master también corre NameNode, ResourceManager, History Server y Grafana
spark.driver.memory              2g

# Mismo Python (entorno virtual) en el driver y en todos los executors
spark.pyspark.python             /opt/danper/.venv/bin/python
spark.pyspark.driver.python      /opt/danper/.venv/bin/python

# Event log en HDFS para el Spark History Server (puerto 18080, solo por túnel)
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://MASTER_HOST:9000/danper/spark-events
spark.history.fs.logDirectory    hdfs://MASTER_HOST:9000/danper/spark-events

# Ejecución adaptativa (AQE): junta las particiones del shuffle según los datos
spark.sql.adaptive.enabled       true
