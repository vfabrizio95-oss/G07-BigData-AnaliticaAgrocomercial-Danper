# nginx del master: única puerta pública de la plataforma Danper.
# infra/aws/instalar_portal.sh lo copia a /etc/nginx/sites-available/danper y
# reemplaza SECRETO_ORIGEN por el valor guardado en /etc/danper/origen_cloudfront.
#
# Solo CloudFront llega a este puerto: el grupo de seguridad danper-web admite el
# puerto 80 únicamente desde la lista de prefijos de CloudFront, y además cada
# petición debe traer el encabezado X-Danper-Origen que agrega la distribución.
# YARN (8088), HDFS (9870/9000), el History Server (18080) y Grafana (3000)
# siguen sin estar expuestos: nginx solo reenvía a Grafana y al portal.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    # Comprobación de salud sin encabezado, solo desde el propio master.
    # Las demás rutas exigen el encabezado secreto de CloudFront (403 si falta).
    location = /salud-local {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000/salud;
    }

    # Portal: carga de datos y estado del pipeline (web/portal.py)
    location ~ ^/(carga|estado|api|salud)(/|$) {
        if ($http_x_danper_origen != "SECRETO_ORIGEN") { return 403; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Tablero de Grafana (solo lectura para visitantes)
    location / {
        if ($http_x_danper_origen != "SECRETO_ORIGEN") { return 403; }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
