# Dashboard del pipeline Danper: Grafana sobre el esquema Gold de PostgreSQL.
#
# Uso (desde esta carpeta):
#   docker compose up -d      # levantar  -> http://localhost:3000
#   docker compose down       # detener (los datos de Grafana se conservan)
#
# La conexión se configura con variables (en el entorno o en dashboard/.env,
# que no se sube al repositorio):
#   DANPER_GRAFANA_PG_PASSWORD  contraseña de grafana_lector (obligatoria)
#   DANPER_GRAFANA_PG_HOST      servidor PostgreSQL      (localhost:5432)
#   DANPER_GRAFANA_PG_DB        base de datos            (danper)
#   DANPER_GRAFANA_PG_USER      usuario de solo lectura  (grafana_lector)
#   DANPER_GRAFANA_PG_SSLMODE   cifrado de la conexión   (disable; en AWS require)
#   DANPER_GRAFANA_ADDR         IP donde escucha Grafana (127.0.0.1; también en
#                               AWS: se entra por un túnel de Session Manager)
#   DANPER_GRAFANA_ADMIN_PASSWORD  contraseña inicial del usuario admin (admin)
#
# En el cluster AWS se levanta con infra/aws/iniciar_grafana.sh, que toma
# estas variables de Parameter Store.
services:
  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: danper-grafana
    restart: unless-stopped
    # Red del equipo: Grafana ve PostgreSQL en localhost sin exponer la base.
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: ${DANPER_GRAFANA_ADDR:-127.0.0.1}
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_PASSWORD: ${DANPER_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      DANPER_GRAFANA_PG_HOST: ${DANPER_GRAFANA_PG_HOST:-localhost:5432}
      DANPER_GRAFANA_PG_DB: ${DANPER_GRAFANA_PG_DB:-danper}
      DANPER_GRAFANA_PG_USER: ${DANPER_GRAFANA_PG_USER:-grafana_lector}
      DANPER_GRAFANA_PG_SSLMODE: ${DANPER_GRAFANA_PG_SSLMODE:-disable}
      DANPER_GRAFANA_PG_PASSWORD: ${DANPER_GRAFANA_PG_PASSWORD:?Defina DANPER_GRAFANA_PG_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_datos:/var/lib/grafana

volumes:
  grafana_datos:
